[project]
name = "game-of-life"
version = "0.2.0"
description = "Implementación en Python de 'Game of Life' de John Conway, llevado a cabo con el propósito de probar el framework pytest."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "textual>=0.79.1",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.2",
    "textual-dev>=1.6.1",
]

[project.scripts]
game-of-life = "game_of_life:main"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
